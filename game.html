<!doctype html>
<head>
    <title>Softy | Example | Game</title>
    <style>
        @font-face {
            font-family: 'Play'; 
            src: url('/assets/fonts/Play/Play-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @media screen and (min-width: 320px) and (orientation: portrait) {
          html {
            transform: rotate(-90deg);
            transform-origin: left top;
            width: 100vh;
            height: 100vw;
            overflow-x: hidden;
            position: absolute;
            top: 100%;
            left: 0;
          }
        }

        * {
            margin: 0;
            padding: 0;
            font-family: Play;
        }

        body {
            background-color: black;
        }
    </style>
</head>

<body>
    <canvas id="mainCanvas"></canvas>
    <script type="module" src="/src/example-game/index.ts"></script>
</body>
